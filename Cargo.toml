[package]
name = "inverter"
version = "0.4.3"
edition = "2021"
rust-version = "1.85"
resolver = "3"
description = "Hybrid solar/battery inverter control over Modbus"
license = "MIT"
repository = "https://github.com/kilowattclub/inverter"
readme = "README.md"
keywords = ["modbus", "inverter", "battery", "solar", "energy"]
categories = ["hardware-support", "network-programming"]
include = ["/src", "/tests", "/examples", "/scripts", "/README.md", "/CHANGELOG.md", "/LICENSE"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["serial", "tcp", "foxess", "mock"]
serial = ["dep:serialport"]
tcp = []
foxess = []
mock = []

[dependencies]
log = "0.4"
rmodbus = "0.12"
thiserror = "2"
# A fixed serial port needs no hotplug enumeration; disabling the default
# `libudev` feature avoids a build dependency on libudev-dev.
serialport = { version = "4", default-features = false, optional = true }

[dev-dependencies]
signal-hook = "0.3"

[[example]]
name = "tour"
required-features = ["mock"]

[[example]]
name = "foxess_read"
required-features = ["foxess", "serial", "tcp"]

[[example]]
name = "foxess_write"
path = "scripts/foxess_write.rs"
required-features = ["foxess", "serial"]
